services:
  mongodb:
    image: mongo:7
    container_name: shopit-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - shopit
    restart: unless-stopped

  backend:
    build:
      context: ./shopit-backend
      dockerfile: Dockerfile
    container_name: shopit-backend
    ports:
      - "5000:5000"
    env_file:
      - ./shopit-backend/.env
    environment:
      - MONGO_URI=mongodb://mongodb:27017/shopit
      - NODE_ENV=development
    volumes:
      - ./shopit-backend/src:/app/src
      - ./shopit-backend/nodemon.json:/app/nodemon.json
    depends_on:
      mongodb:
        condition: service_started
    networks:
      - shopit
    restart: on-failure

  frontend:
    build:
      context: ./shopit
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_URL: http://localhost:5000
    container_name: shopit-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BASE_URL=http://localhost:5000
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./shopit/app:/app/app
      - ./shopit/components:/app/components
      - ./shopit/lib:/app/lib
      - ./shopit/pages:/app/pages
      - ./shopit/public:/app/public
      - ./shopit/services:/app/services
      - ./shopit/store:/app/store
      - ./shopit/types:/app/types
      - ./shopit/svg:/app/svg
      - ./shopit/package.json:/app/package.json
      - ./shopit/package-lock.json:/app/package-lock.json
      - ./shopit/next.config.ts:/app/next.config.ts
      - ./shopit/tailwind.config.ts:/app/tailwind.config.ts
      - ./shopit/postcss.config.mjs:/app/postcss.config.mjs
      - ./shopit/tsconfig.json:/app/tsconfig.json
      - /app/node_modules
      - /app/.next
    depends_on:
      backend:
        condition: service_started
    networks:
      - shopit
    restart: on-failure

networks:
  shopit:
    driver: bridge

volumes:
  mongo_data:
